<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeShield</title>
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="header">
        <div class="brand">
          <img
            src="../../../assets/icons/icon48.png"
            alt=""
            class="logo"
            width="24"
            height="24"
          />
          <h1 class="title">SafeShield</h1>
        </div>
        <label class="toggle-switch" title="Toggle prompt protection">
          <input
            type="checkbox"
            id="shield-toggle"
            aria-label="Enable SafeShield protection"
          />
          <span class="toggle-slider"></span>
        </label>
      </header>

      <div class="status-card" id="status-card">
        <div class="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Checking status...</span>
        </div>
      </div>

      <div class="ai-card" id="ai-card">
        <div class="ai-header">
          <div>
            <span class="ai-title">Local AI Assist (Names & Addresses)</span>
            <span class="ai-subtitle">Runs only on your computer (Ollama)</span>
          </div>
          <label class="toggle-switch-sm" title="Toggle local Gemma assist">
            <input
              type="checkbox"
              id="ai-toggle"
              aria-label="Enable local AI assist"
            />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <section class="stats-card">
        <div class="stats-header">
          <span class="stats-title">Redaction Statistics</span>
          <span class="total-badge" id="total-count">0 protected</span>
        </div>
        <div class="stats-grid" id="stats-grid">
          <div class="stat-item">
            <span class="stat-label">Phone</span>
            <span class="stat-value" id="stat-phone">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Email</span>
            <span class="stat-value" id="stat-email">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Aadhaar</span>
            <span class="stat-value" id="stat-aadhaar">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">PAN</span>
            <span class="stat-value" id="stat-pan">0</span>
          </div>
        </div>
      </section>

      <div class="send-redacted-section" id="send-redacted-section">
        <button type="button" id="send-redacted-btn" class="send-redacted-btn" aria-label="Scan and send the current prompt with PII redacted">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Send Redacted
        </button>
        <div class="send-redacted-feedback" id="send-redacted-feedback" role="status" aria-live="polite"></div>
      </div>

      <footer class="footer">
        <button type="button" id="open-dashboard-btn" class="dashboard-link">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          Privacy Dashboard
        </button>
      </footer>
    </div>

    <script src="../../shared/constants.js"></script>
    <script src="../../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
